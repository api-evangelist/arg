name: ARG
description: >-
  GoodPeople (ARG) is a boardriding community platform and e-commerce brand for
  skiers and snowboarders, operating under the tagline "Where the boardriding
  family meets." It publishes freeride competition results and rankings across
  events such as the Freeride World Tour (FWT), the IFSA Freeride World Qualifier
  (FWQ), and the World Rookie Snowboard Finals, alongside a blog covering event
  highlights, athlete spotlights, and freeride footage. The company also runs an
  online shop selling apparel, accessories, and lifestyle products, with a
  sustainability program that plants one tree for every purchase. It was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network as
  a stub for enrichment. No public API, developer portal, or OpenAPI surface was
  found during enrichment.
